<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <title id="title">Northstar policy assistant architecture</title>
  <desc id="desc">A customer question goes to the policy agent loop in this application, which calls the agent in Microsoft Foundry. The agent requests the search_policy tool, which sends a date-filtered query to the knowledge base in Azure AI Search. Returned passages are checked against the policy files and the answer's citations are checked before it is returned. Spans go to Application Insights. A separate portal agent runs inside Foundry against a knowledge base limited to current policies.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F6B7A"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#F8FAFC"/>
  <text x="30" y="46" font-size="22" font-weight="600" fill="#17233C">Northstar policy assistant: architecture</text>

  <!-- Customer -->
  <rect x="30" y="117" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
  <text x="105" y="147" font-size="15" font-weight="600" fill="#17233C" text-anchor="middle">Customer question</text>
  <text x="105" y="168" font-size="12" fill="#5F6B7A" text-anchor="middle">command line</text>

  <!-- This application -->
  <rect x="230" y="80" width="360" height="440" rx="14" fill="#F1ECFF" stroke="#6E42D8"/>
  <text x="250" y="104" font-size="13" font-weight="600" fill="#6E42D8">THIS APPLICATION (PYTHON)</text>
  <g font-size="15" font-weight="600" fill="#17233C">
    <rect x="250" y="120" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="266" y="147">Policy agent loop</text>
    <rect x="250" y="214" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="266" y="241">search_policy tool</text>
    <rect x="250" y="308" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="266" y="335">Passage check</text>
    <rect x="250" y="402" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="266" y="429">Citation check</text>
  </g>
  <g font-size="12" fill="#5F6B7A">
    <text x="266" y="167">Runs the tool calls the agent asks for</text>
    <text x="266" y="261">Order or event date becomes a filter</text>
    <text x="266" y="355">Right dates, known ID, same text as the files</text>
    <text x="266" y="449">Only retrieved passages may be cited</text>
    <text x="250" y="500">Each step writes an OpenTelemetry span</text>
  </g>

  <!-- Microsoft Foundry -->
  <rect x="680" y="80" width="490" height="200" rx="14" fill="#EAF1FF" stroke="#2F6FED"/>
  <text x="700" y="104" font-size="13" font-weight="600" fill="#2F6FED">MICROSOFT FOUNDRY</text>
  <g font-size="15" font-weight="600" fill="#17233C">
    <rect x="700" y="120" width="215" height="64" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="716" y="147">Policy agent</text>
    <rect x="935" y="120" width="215" height="64" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="951" y="147">Evaluations</text>
    <rect x="700" y="200" width="215" height="60" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="716" y="225">Traces and Monitor</text>
    <rect x="935" y="200" width="215" height="60" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="951" y="225">Portal agent</text>
  </g>
  <g font-size="12" fill="#5F6B7A">
    <text x="716" y="167">Instructions, model, tool definition</text>
    <text x="951" y="167">Judge model and code graders</text>
    <text x="716" y="245">Server-side, automatic</text>
    <text x="951" y="245">Runs in the playground</text>
  </g>

  <!-- Azure AI Search -->
  <rect x="680" y="310" width="490" height="210" rx="14" fill="#E7F6EF" stroke="#168A5B"/>
  <text x="700" y="334" font-size="13" font-weight="600" fill="#168A5B">AZURE AI SEARCH</text>
  <g font-size="15" font-weight="600" fill="#17233C">
    <rect x="700" y="350" width="215" height="64" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="716" y="377">Knowledge base</text>
    <rect x="935" y="350" width="215" height="64" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="951" y="377">Current-policies base</text>
    <rect x="700" y="436" width="215" height="64" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="716" y="463">Knowledge source</text>
    <rect x="935" y="436" width="215" height="64" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="951" y="463">Index</text>
  </g>
  <g font-size="12" fill="#5F6B7A">
    <text x="716" y="397">Plans sub-queries, all versions</text>
    <text x="951" y="397">Fixed filter: in effect now</text>
    <text x="716" y="483">Points at the index</text>
    <text x="951" y="483">120 policy passages, with dates</text>
  </g>

  <!-- Bottom row -->
  <rect x="230" y="560" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
  <text x="246" y="588" font-size="15" font-weight="600" fill="#17233C">Dataset</text>
  <text x="246" y="610" font-size="12" fill="#5F6B7A">40 policy documents, 33 labeled questions, 144 return cases</text>
  <rect x="680" y="560" width="235" height="70" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
  <text x="696" y="588" font-size="15" font-weight="600" fill="#17233C">Application Insights</text>
  <text x="696" y="610" font-size="12" fill="#5F6B7A">Spans and log queries</text>
  <rect x="935" y="560" width="235" height="70" rx="10" fill="#FFFFFF" stroke="#5F6B7A" stroke-dasharray="6 4"/>
  <text x="951" y="588" font-size="15" font-weight="600" fill="#17233C">Orders and returns backend</text>
  <text x="951" y="610" font-size="12" fill="#5F6B7A">Tested; not yet wired to the agent</text>

  <!-- Flows -->
  <g fill="none" stroke="#5F6B7A" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="180" y1="152" x2="248" y2="152"/>
    <line x1="570" y1="140" x2="698" y2="140"/>
    <line x1="700" y1="166" x2="572" y2="166"/>
    <line x1="410" y1="184" x2="410" y2="212"/>
    <polyline points="570,246 636,246 636,382 698,382"/>
    <line x1="410" y1="278" x2="410" y2="306"/>
    <line x1="410" y1="372" x2="410" y2="400"/>
    <line x1="807" y1="414" x2="807" y2="434"/>
    <line x1="915" y1="468" x2="933" y2="468"/>
    <line x1="1042" y1="260" x2="1042" y2="348"/>
    <line x1="1042" y1="414" x2="1042" y2="434"/>
    <polyline points="500,520 500,540 797,540 797,558"/>
  </g>
  <g font-size="11" fill="#5F6B7A" text-anchor="middle">
    <text x="635" y="132">question</text>
    <text x="635" y="182">tool call, answer</text>
    <text x="604" y="238">filter</text>
    <text x="640" y="534">spans</text>
    <text x="1090" y="300">built-in tool</text>
  </g>
</svg>
