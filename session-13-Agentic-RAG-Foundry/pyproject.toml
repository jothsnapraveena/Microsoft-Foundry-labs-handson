[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-support"
version = "0.1.0"
description = "Fictional retail support agent: agentic retrieval with a deterministic backend"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
